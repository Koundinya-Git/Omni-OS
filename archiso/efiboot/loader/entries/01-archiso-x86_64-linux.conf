title   Omni-OS (x86_64, UEFI, linux-zen)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer splash nvidia_drm.modeset=1 nvidia.NVreg_PreserveVideoMemoryAllocations=1
