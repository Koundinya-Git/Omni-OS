# Minimal Sleek Starship Prompt
format = """
$directory\
$git_branch\
$git_status\
$c\
$golang\
$java\
$nodejs\
$python\
$rust\
$line_break\
$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #7dcfff)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"

[directory]
style = "bold #7aa2f7"
read_only = " "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #e0af68"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = " "
style = "bold #9ece6a"

[python]
symbol = " "
style = "bold #e0af68"

[rust]
symbol = " "
style = "bold #f7768e"

[c]
symbol = " "
style = "bold #7aa2f7"
