insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

search --no-floppy --set=root --label OMNI_OS

set timeout=5
set default=0

menuentry "Omni-OS (x86_64, UEFI, linux-zen)" {
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Omni-OS (x86_64, UEFI, linux-lts)" {
    linux /arch/boot/x86_64/vmlinuz-linux-lts archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-lts.img
}

menuentry "Omni-OS (x86_64, UEFI, linux)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Run Memtest86+ (RAM test)" {
    linux /arch/boot/memtest86+/memtest.efi
}
