DEFAULT zen
TIMEOUT 50
PROMPT 1
DISPLAY boot.msg

LABEL zen
    MENU LABEL Omni-OS (x86_64, BIOS, linux-zen)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3

LABEL lts
    MENU LABEL Omni-OS (x86_64, BIOS, linux-lts)
    LINUX /arch/boot/x86_64/vmlinuz-linux-lts
    INITRD /arch/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3

LABEL default
    MENU LABEL Omni-OS (x86_64, BIOS, linux)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=OMNI_OS quiet splash loglevel=3

LABEL memtest
    MENU LABEL Run Memtest86+ (RAM test)
    LINUX /arch/boot/memtest86+/memtest
