---
backend: pacman

skip_if_no_internet: false
update_db: true
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: false

operations:
  - install:
    - btrfs-progs
    - cryptsetup
    - grub
    - efibootmgr
    - networkmanager
    - bluez
    - bluez-utils
    - zsh
    - ollama
    - apparmor
