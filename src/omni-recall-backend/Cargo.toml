[package]
name = "omni-recall-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
dirs = "5.0"
image = "0.24"
image_hasher = "1.2"
reqwest = { version = "0.11", features = ["json"] }
tar = "0.4"
xz2 = "0.1"
