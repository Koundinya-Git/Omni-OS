name: Build Omni-OS ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t omni-os-builder .

      - name: Run Docker Container to Build ISO
        run: |
          mkdir -p out
          docker run --privileged --name omni-os-build omni-os-builder
          docker cp omni-os-build:/build/out/. out/
          docker rm omni-os-build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-OS-Live
          path: out/*.iso
          retention-days: 7
