name: Build Omni-OS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Omni-OS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git mtools dosfstools squashfs-tools libisoburn grub

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare archiso profile
        run: |
          mkdir -p /tmp/omni-os-profile
          cp -r archiso/* /tmp/omni-os-profile/
          chmod -R 755 /tmp/omni-os-profile/

      - name: Set executable permissions on scripts
        run: |
          chmod +x /tmp/omni-os-profile/airootfs/usr/local/bin/*

      - name: Build ISO
        run: |
          mkdir -p /tmp/omni-os-build /tmp/omni-os-out
          mkarchiso -v \
            -w /tmp/omni-os-build \
            -o /tmp/omni-os-out \
            /tmp/omni-os-profile

      - name: List ISO output
        run: ls -lh /tmp/omni-os-out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-os-iso
          path: /tmp/omni-os-out/*.iso
          retention-days: 7
          compression-level: 0

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/omni-os-out/*.iso
          generate_release_notes: true
